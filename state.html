<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>State Details — Azadi.wtf</title>
<style>
:root {
  --bg: #060606; --bg-card: #0d0d0d; --bg-elevated: #141414;
  --border: #1e1e1e; --text: #ededed; --text-dim: #7e7e7e; --text-muted: #484848;
  --accent: #dc4536; --d-critical: #e62e1e; --d-high: #e86930;
  --d-moderate: #d4a020; --d-low: #2ea85a;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 60px; }
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; -webkit-font-smoothing:antialiased; }

.container { max-width:1100px; margin:0 auto; padding:0 24px; }

/* Sidebar layout */
.state-layout { display:grid; grid-template-columns:200px 1fr; gap:44px; margin-top:8px; align-items:start; }
.state-nav { position:sticky; top:66px; }
.state-nav ul { list-style:none; }
.state-nav li { margin-bottom:1px; }
.state-nav .nav-section { font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-muted); padding:10px 12px 4px; }
.state-nav a { display:block; padding:5px 12px; font-size:0.76rem; font-weight:500; color:var(--text-dim); text-decoration:none; border-radius:5px; transition:all 0.1s; }
.state-nav a:hover { color:var(--text); background:var(--bg-elevated); }
.state-nav a.active { color:var(--accent); background:rgba(220,69,54,0.08); }
.state-nav .nav-sub { padding-left:16px; font-size:0.72rem; opacity:0.85; }

@media (max-width:840px) {
  .state-layout { grid-template-columns:1fr; gap:20px; }
  .state-nav { position:static; overflow-x:auto; white-space:nowrap; padding-bottom:4px; -webkit-overflow-scrolling:touch; }
  .state-nav ul { display:flex; gap:2px; }
  .state-nav li { margin-bottom:0; }
  .state-nav a { white-space:nowrap; font-size:0.74rem; padding:5px 10px; }
  .state-nav .nav-section { display:none; }
}

/* NAV */
.top-nav { position:sticky; top:0; z-index:100; background:rgba(6,6,6,0.88); backdrop-filter:blur(16px); border-bottom:1px solid var(--border); height:50px; }
.top-nav .container { max-width:1100px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:100%; }
.nav-logo { font-size:0.95rem; font-weight:800; color:var(--text); text-decoration:none; letter-spacing:-0.02em; }
.nav-links { display:flex; align-items:center; gap:4px; }
.nav-links a { color:var(--text-dim); text-decoration:none; font-size:0.82rem; font-weight:500; padding:5px 12px; border-radius:5px; transition:all 0.1s; }
.nav-links a:hover { color:var(--text); }
.btn-pdf { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; font-size:0.76rem; font-weight:600; border-radius:5px; cursor:pointer; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text); text-decoration:none; transition:all 0.1s; font-family:var(--font); }
.btn-pdf:hover { border-color:var(--accent); }

/* Hamburger */
.nav-toggle { display:none; }
.nav-toggle-label { display:none; cursor:pointer; padding:4px; }
.nav-toggle-label span { display:block; width:22px; height:2px; background:var(--text-dim); margin:5px 0; border-radius:2px; transition:all 0.2s; }
.nav-toggle:checked ~ .nav-links { display:flex; }
.nav-toggle:checked ~ .nav-toggle-label span:nth-child(1) { transform:rotate(45deg) translate(5px,5px); }
.nav-toggle:checked ~ .nav-toggle-label span:nth-child(2) { opacity:0; }
.nav-toggle:checked ~ .nav-toggle-label span:nth-child(3) { transform:rotate(-45deg) translate(5px,-5px); }

@media (max-width:640px) {
  .nav-toggle-label { display:block; }
  .nav-links { display:none; position:absolute; top:50px; left:0; right:0;
    background:rgba(6,6,6,0.96); backdrop-filter:blur(16px);
    flex-direction:column; padding:12px 20px; gap:2px;
    border-bottom:1px solid var(--border); z-index:99; }
  .nav-links a { padding:10px 16px; width:100%; border-radius:6px; }
}

header { padding:40px 0 24px; border-bottom:1px solid var(--border); text-align:center; }
header h1 { font-size:1.8rem; font-weight:900; letter-spacing:-0.02em; }
.state-meta { display:flex; justify-content:center; gap:12px; margin-top:10px; flex-wrap:wrap; align-items:center; }
.danger-badge {
  font-size:0.65rem; font-weight:800; letter-spacing:0.06em;
  padding:4px 12px; border-radius:100px; text-transform:uppercase;
}
.danger-badge.critical { background:var(--d-critical); color:#fff; }
.danger-badge.high { background:var(--d-high); color:#fff; }
.danger-badge.moderate { background:var(--d-moderate); color:#000; }
.danger-badge.low { background:var(--d-low); color:#fff; }
.danger-badge.none { background:#1e1e1e; color:#888; }

.political-bar {
  display:flex; justify-content:center; gap:20px; margin:16px 0 0;
  flex-wrap:wrap; font-size:0.8rem; color:var(--text-dim);
}
.political-bar strong { color:var(--text); }
.party-badge { font-size:0.62rem; font-weight:700; padding:2px 8px; border-radius:100px; text-transform:uppercase; letter-spacing:0.04em; }
.party-nda { background:rgba(255,153,51,0.15); color:#ff9933; }
.party-india { background:rgba(0,136,255,0.15); color:#0088ff; }
.party-other { background:rgba(255,255,255,0.06); color:#aaa; }

.back-link { display:inline-block; margin:24px 0 0; color:var(--text-dim); text-decoration:none; font-size:0.82rem; font-weight:500; }
.back-link:hover { color:var(--text); }

main { padding:32px 0 60px; }
.section-title { font-size:0.78rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); margin:32px 0 12px; }
.section-title:first-child { margin-top:0; }

/* Demographics — two-column layout */
.demo-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; margin:20px 0; border:1px solid var(--border); border-radius:8px; overflow:hidden; }
.demo-grid .col { padding:0; }
.demo-grid .col:first-child { border-right:1px solid var(--border); }
.demo-row { display:flex; padding:10px 16px; border-bottom:1px solid var(--border); font-size:0.78rem; align-items:flex-start; }
.demo-row:last-child { border-bottom:none; }
.demo-label { color:var(--text-muted); font-weight:600; min-width:110px; flex-shrink:0; }
.demo-value { color:var(--text-dim); line-height:1.4; }
.demo-religion { display:flex; flex-wrap:wrap; gap:2px 10px; }
.demo-religion span { font-size:0.73rem; }
.demo-crops { display:flex; flex-wrap:wrap; gap:3px; }
.demo-crop { background:var(--bg-elevated); padding:1px 8px; border-radius:100px; font-size:0.7rem; color:var(--text-dim); }
.party-badge { font-size:0.58rem; font-weight:700; padding:1px 6px; border-radius:100px; text-transform:uppercase; letter-spacing:0.03em; }
.party-nda { background:rgba(255,153,51,0.15); color:#ff9933; }
.party-india { background:rgba(0,136,255,0.15); color:#0088ff; }
.party-other { background:rgba(255,255,255,0.06); color:#aaa; }

@media (max-width:600px) {
  .demo-grid { grid-template-columns:1fr; }
  .demo-grid .col:first-child { border-right:none; border-bottom:1px solid var(--border); }
}

.protest-card {
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:8px; padding:24px 26px; margin-bottom:14px;
  border-left:4px solid; transition:background 0.1s;
}
.protest-card:hover { background:var(--bg-elevated); }
.protest-card.critical { border-left-color:var(--d-critical); }
.protest-card.high { border-left-color:var(--d-high); }
.protest-card.moderate { border-left-color:var(--d-moderate); }
.protest-card.low { border-left-color:var(--d-low); }

.protest-header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:8px; flex-wrap:wrap; }
.protest-header h3 { font-size:1.1rem; font-weight:700; letter-spacing:-0.01em; }
.d-tag { font-size:0.58rem; font-weight:800; letter-spacing:0.05em; padding:2px 8px; border-radius:100px; text-transform:uppercase; white-space:nowrap; }
.d-tag.critical { background:var(--d-critical); color:#fff; }
.d-tag.high { background:var(--d-high); color:#fff; }
.d-tag.moderate { background:var(--d-moderate); color:#000; }
.d-tag.low { background:var(--d-low); color:#fff; }
.protest-meta { font-size:0.8rem; color:var(--text-muted); margin-bottom:6px; }
.protest-meta strong { color:var(--text-dim); font-weight:600; }
.protest-cause { font-size:0.86rem; color:var(--text-dim); margin-bottom:10px; font-style:italic; line-height:1.55; }
.protest-status { font-size:0.9rem; color:var(--text); margin-bottom:12px; line-height:1.6; }
.protest-reason { font-size:0.84rem; color:var(--text-dim); padding:14px 16px; background:var(--bg-elevated); border-radius:6px; margin-bottom:12px; line-height:1.6; }
.protest-reason strong { color:var(--text); }
.protest-details { list-style:none; font-size:0.84rem; }
.protest-details li { padding:5px 0; color:var(--text-dim); border-bottom:1px solid var(--border); line-height:1.55; }
.protest-details li:last-child { border:none; }
.protest-details li strong { color:var(--text); font-weight:600; }

.news-section { margin-top:40px; padding-top:28px; border-top:1px solid var(--border); }
.news-section h2 { font-size:1.1rem; font-weight:800; margin-bottom:16px; letter-spacing:-0.01em; }
.news-item {
  display:block; padding:14px 16px; margin-bottom:6px;
  background:var(--bg-card); border:1px solid var(--border);
  border-radius:6px; text-decoration:none; color:inherit;
  transition:all 0.12s ease;
}
.news-item:hover { border-color:var(--border-light, #333); background:var(--bg-elevated); }
.news-item-source { font-size:0.7rem; font-weight:700; color:var(--accent); margin-bottom:4px; text-transform:uppercase; letter-spacing:0.05em; }
.news-item-type {
  font-weight:500; color:var(--text-muted); font-size:0.65rem;
  background:var(--bg-elevated); padding:1px 6px; border-radius:3px; margin-left:6px;
}
.news-item h4 { font-size:0.88rem; font-weight:700; margin:0 0 4px; line-height:1.35; }
.news-item p { font-size:0.78rem; color:var(--text-dim); margin:0; line-height:1.45; }

.none-text { text-align:center; padding:40px; color:var(--text-muted); font-size:0.9rem; }
.error-text { text-align:center; padding:60px 20px; color:var(--d-critical); font-size:0.9rem; }

footer { text-align:center; padding:32px 0; border-top:1px solid var(--border); font-size:0.72rem; color:var(--text-muted); }
footer a { color:var(--accent); text-decoration:none; }

@media (max-width:500px) {
  .protest-card { padding:14px 16px; }
  header h1 { font-size:1.4rem; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="container">
    <a href="index.html" class="nav-logo">&#9994; azadi.wtf</a>
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label"><span></span><span></span><span></span></label>
    <div class="nav-links">
      <a href="checklist.html">Checklist</a>
      <a href="history.html">Historical Movements</a>
      <a href="guide.html">Protest Guide</a>
      <a href="Protest%20Safely.pdf" class="btn-pdf" download>PDF</a>
    </div>
  </div>
</nav>

<div class="container" id="app">
  <div class="error-text">Loading state data...</div>
</div>

<footer>
  <div class="container">
    <a href="index.html">← Back to India Map</a> &nbsp;·&nbsp; azadi.wtf
  </div>
</footer>

<script src="data.js"></script>
<script>
(function() {
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var app = document.getElementById('app');

  if (!code || !STATE_DATA[code]) {
    app.innerHTML = '<div class="error-text">State not found. <a href="index.html" style="color:var(--accent);">Go back to the map</a>.</div>';
    return;
  }

  var d = STATE_DATA[code];
  var dangerW = { critical:3, high:2, moderate:1, low:0 };

  function highest(protests) {
    if (!protests.length) return 'none';
    var m = 0;
    protests.forEach(function(p) { m = Math.max(m, dangerW[p.dangerLevel]||0); });
    return ['low','moderate','high','critical'][m] || 'low';
  }

  var danger = highest(d.protests);
  var ab = d.alliance==='NDA'?'party-nda':(d.alliance==='INDIA'?'party-india':'party-other');

  document.title = d.name + ' — azadi.wtf';

  var html = '';

  // Header — state name + danger badge (above the layout)
  html += '<header>';
  html += '<h1>'+d.name+'</h1>';
  html += '<div class="state-meta">';
  html += '<span class="danger-badge '+danger+'">'+(danger==='none'?'No Protests':danger.toUpperCase())+'</span>';
  html += '<span style="font-size:0.8rem;color:var(--text-dim);">'+d.totalProtests+' active protest'+(d.totalProtests!==1?'s':'')+'</span>';
  html += '</div>';
  html += '<a href="index.html" class="back-link">← Back to India Map</a>';
  html += '</header>';

  // Sidebar + content layout
  html += '<div class="state-layout">';
  html += '<aside class="state-nav" id="stateNav">';
  html += '<ul>';
  html += '<li class="nav-section">Sections</li>';
  html += '<li><a href="#overview">State Overview</a></li>';
  html += '<li><a href="#help">Help & Resources</a></li>';
  html += '<li><a href="#protests">All Protests</a></li>';
  var sp = d.protests.slice().sort(function(a,b){return (dangerW[b.dangerLevel]||0)-(dangerW[a.dangerLevel]||0);});
  sp.forEach(function(p, i) {
    html += '<li><a href="#protest-'+i+'" class="nav-sub">'+p.name.substring(0,32)+(p.name.length>32?'...':'')+'</a></li>';
  });
  if (d.news && d.news.length) {
    html += '<li><a href="#news">Latest News</a></li>';
  }
  html += '</ul>';
  html += '</aside>';
  html += '<div class="state-content">';

  // Two-column overview table
  html += '<main class="container">';
  html += '<div class="section-title" id="overview">State Overview</div>';
  html += '<div class="demo-grid">';
  // Left column
  html += '<div class="col">';
  html += '<div class="demo-row"><span class="demo-label">Chief Minister</span><span class="demo-value">'+d.cm+'</span></div>';
  html += '<div class="demo-row"><span class="demo-label">Party</span><span class="demo-value"><span class="party-badge '+ab+'">'+d.party+'</span>'+(d.alliance?' <span style="font-size:0.68rem;color:var(--text-muted)">('+d.alliance+')</span>':'')+'</span></div>';
  html += '<div class="demo-row"><span class="demo-label">Opposition</span><span class="demo-value">'+d.opposition+'</span></div>';
  html += '<div class="demo-row"><span class="demo-label">Last Election</span><span class="demo-value">'+d.lastElection+'</span></div>';
  if (d.demographics) {
    var dm = d.demographics;
    html += '<div class="demo-row"><span class="demo-label">Population</span><span class="demo-value">'+dm.population+'</span></div>';
    html += '<div class="demo-row"><span class="demo-label">Area</span><span class="demo-value">'+dm.area+'</span></div>';
    html += '<div class="demo-row"><span class="demo-label">Terrain</span><span class="demo-value">'+dm.terrain+'</span></div>';
  }
  html += '</div>';
  // Right column
  html += '<div class="col">';
  if (d.demographics) {
    var dm = d.demographics;
    html += '<div class="demo-row"><span class="demo-label">Literacy</span><span class="demo-value">'+dm.literacy+'</span></div>';
    html += '<div class="demo-row"><span class="demo-label">GDP</span><span class="demo-value">'+dm.gdp+'</span></div>';
    html += '<div class="demo-row"><span class="demo-label">Avg Income</span><span class="demo-value">'+dm.avgIncome+'</span></div>';
    if (dm.hdi) html += '<div class="demo-row"><span class="demo-label">Human Dev.<br>Index</span><span class="demo-value">'+dm.hdi+'</span></div>';
    if (dm.languages) html += '<div class="demo-row"><span class="demo-label">Languages</span><span class="demo-value">'+dm.languages+'</span></div>';
    if (dm.religion) {
      var rel = '';
      Object.keys(dm.religion).forEach(function(k) { rel += '<span><strong>'+k+':</strong> '+dm.religion[k]+'</span>'; });
      html += '<div class="demo-row"><span class="demo-label">Religion</span><span class="demo-value"><div class="demo-religion">'+rel+'</div></span></div>';
    }
    if (dm.topCrops && dm.topCrops.length) {
      var crops = '';
      dm.topCrops.forEach(function(c) { crops += '<span class="demo-crop">'+c+'</span>'; });
      html += '<div class="demo-row"><span class="demo-label">Top Crops</span><span class="demo-value"><div class="demo-crops">'+crops+'</div></span></div>';
    }
  } else {
    html += '<div class="demo-row"><span class="demo-label">Info</span><span class="demo-value" style="color:var(--text-muted);font-style:italic;">Coming soon</span></div>';
  }
  html += '</div></div>';

  // Economy section
  if (d.demographics && (d.demographics.exports || d.demographics.topCities)) {
    var dm = d.demographics;
    html += '<div class="demo-grid" style="margin-top:16px;" id="overview-table2">';
    html += '<div class="col">';
    if (dm.exports) {
      html += '<div class="demo-row"><span class="demo-label">Top Exports</span><span class="demo-value">';
      if (dm.exportsTotal) html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">Total: '+dm.exportsTotal+'</div>';
      dm.exports.forEach(function(e,i) { html += '<div style="margin-bottom:2px;">'+(i+1)+'. '+e+'</div>'; });
      html += '</span></div>';
    }
    if (dm.imports) {
      html += '<div class="demo-row"><span class="demo-label">Top Imports</span><span class="demo-value">';
      if (dm.importsTotal) html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:4px;">Total: '+dm.importsTotal+'</div>';
      dm.imports.forEach(function(e,i) { html += '<div style="margin-bottom:2px;">'+(i+1)+'. '+e+'</div>'; });
      html += '</span></div>';
    }
    html += '</div><div class="col">';
    if (dm.topCities) {
      html += '<div class="demo-row"><span class="demo-label">Top Cities</span><span class="demo-value">';
      dm.topCities.forEach(function(c) { html += '<div style="margin-bottom:2px;">'+c+'</div>'; });
      html += '</span></div>';
    }
    if (dm.sources) {
      html += '<div class="demo-row"><span class="demo-label">Sources</span><span class="demo-value" style="font-size:0.7rem;">';
      dm.sources.forEach(function(s,i) {
        var url = '#';
        var stateSlug = d.name.replace(/\s+/g,'_').replace(/&/g,'and');
        if (s.indexOf('Census') === 0) url = 'https://censusindia.gov.in/census.website/data/census-tables';
        else if (s.indexOf('Economic Survey') === 0) url = 'https://'+d.name.toLowerCase().replace(/\s+/g,'').replace('&','')+'.gov.in';
        else if (s === 'Wikipedia') url = 'https://en.wikipedia.org/wiki/'+stateSlug;
        else if (s.indexOf('NSSO') === 0) url = 'https://mospi.gov.in';
        html += '<div>'+(i+1)+'. <a href="'+url+'" target="_blank" style="color:var(--accent);">'+s+'</a></div>';
      });
      html += '</span></div>';
    }
    html += '</div></div>';
  }

  html += '</main>';

  // Legal Aid + NGOs section
  if (d.legalAid || d.ngos) {
    html += '<main class="container">';
    html += '<div class="section-title" id="help">Help & Resources</div>';
    html += '<div class="demo-grid">';
    
    // Legal Aid column
    html += '<div class="col">';
    if (d.legalAid) {
      var la = d.legalAid;
      if (la.dlsaNote) html += '<div class="demo-row"><span class="demo-label"></span><span class="demo-value" style="font-size:0.72rem;color:var(--text-muted);font-style:italic;padding:6px 0;">'+la.dlsaNote+'</span></div>';
      if (la.dlsa) html += '<div class="demo-row"><span class="demo-label">DLSA</span><span class="demo-value">'+la.dlsa+'</span></div>';
      html += '<div class="demo-row"><span class="demo-label">NALSA Helpline</span><span class="demo-value" style="color:var(--accent);font-weight:700;">15100</span></div>';
      if (la.hrc) html += '<div class="demo-row"><span class="demo-label">Human Rights</span><span class="demo-value">'+la.hrc+'</span></div>';
      if (la.lawyerCollectives && la.lawyerCollectives.length) {
        html += '<div class="demo-row"><span class="demo-label">Lawyer Networks</span><span class="demo-value">';
        la.lawyerCollectives.forEach(function(lc) { html += '<div style="margin-bottom:2px;">• '+lc+'</div>'; });
        html += '</span></div>';
      }
    }
    html += '</div>';

    // NGOs column
    html += '<div class="col">';
    if (d.ngos) {
      var ng = d.ngos;
      html += '<div class="demo-row"><span class="demo-label">NGOs</span><span class="demo-value">';
      ng.top.forEach(function(n) { html += '<div style="margin-bottom:3px;">• '+n+'</div>'; });
      html += '</span></div>';
    }
    html += '<div class="demo-row"><span class="demo-label">Emergency</span><span class="demo-value" style="color:var(--d-high);">112 — Police / Ambulance / Fire</span></div>';
    html += '</div>';

    html += '</div>';
    html += '</main>';
  }

  // Protests
  html += '<main class="container">';
  html += '<div class="section-title" id="protests">All Active Protests ('+d.totalProtests+')</div>';
  var sorted = d.protests.slice().sort(function(a,b){return (dangerW[b.dangerLevel]||0)-(dangerW[a.dangerLevel]||0);});

  if (!sorted.length) {
    html += '<p class="none-text">No active protests currently reported in '+d.name+'.</p>';
  } else {
    sorted.forEach(function(p, i) {
      html += '<div class="protest-card '+p.dangerLevel+'" id="protest-'+i+'">';
      html += '<div class="protest-header">';
      html += '<h3>'+p.name+'</h3>';
      html += '<span class="d-tag '+p.dangerLevel+'">'+p.dangerLevel.toUpperCase()+'</span>';
      html += '</div>';
      html += '<div class="protest-meta"><strong>Location:</strong> '+p.location+'</div>';
      html += '<div class="protest-cause">'+p.cause+'</div>';
      html += '<div class="protest-status">'+p.status+'</div>';
      if (p.dangerReason) {
        html += '<div class="protest-reason"><strong>Risk Assessment:</strong> '+p.dangerReason+'</div>';
      }
      if (p.details && p.details.length) {
        html += '<ul class="protest-details">';
        p.details.forEach(function(d) { html += '<li>'+d+'</li>'; });
        html += '</ul>';
      }
      html += '</div>';
    });
  }

  // News section
  if (d.news && d.news.length) {
    html += '<div class="news-section" id="news">';
    html += '<h2>Latest News — '+d.name+'</h2>';
    d.news.forEach(function(item) {
      html += '<a href="'+item.url+'" class="news-item" target="_blank" rel="noopener">';
      html += '<div class="news-item-source">'+item.source+' <span class="news-item-type">'+(item.type==='video'?'Video':item.type==='social'?'Social':'Article')+'</span></div>';
      html += '<h4>'+item.title+'</h4>';
      html += '<p>'+item.snippet+'</p>';
      html += '</a>';
    });
    html += '</div>';
  }

  html += '</main>';

  // Close layout
  html += '</div>'; // state-content
  html += '</div>'; // state-layout

  app.innerHTML = html;

  // Sidebar scroll tracking
  var nav = document.getElementById('stateNav');
  if (nav) {
    var links = nav.querySelectorAll('a');
    var sections = [];
    links.forEach(function(link) {
      var href = link.getAttribute('href');
      if (href && href.startsWith('#')) { var el = document.querySelector(href); if (el) sections.push({link:link, el:el}); }
    });
    function update() {
      var scroll = window.scrollY + 120;
      var active = null;
      sections.forEach(function(s) { if (s.el.offsetTop <= scroll) active = s.link; });
      links.forEach(function(l) { l.classList.remove('active'); });
      if (active) active.classList.add('active');
    }
    window.addEventListener('scroll', update, {passive:true});
    update();
  }
})();
</script>
</body>
</html>
