<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Protest Packing Checklist — azadi.wtf</title>
<style>
:root {
  --bg:#060606; --bg-card:#0d0d0d; --bg-elevated:#141414;
  --border:#1e1e1e; --text:#ededed; --text-dim:#7e7e7e; --text-muted:#484848;
  --accent:#dc4536; --green:#2ea85a; --yellow:#d4a020;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:var(--font); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; }

.top-nav {
  position:sticky; top:0; z-index:100;
  background:rgba(6,6,6,0.88); backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border); height:50px;
}
.top-nav .container { max-width:1100px; margin:0 auto; padding:0 20px; display:flex; align-items:center; justify-content:space-between; height:100%; }
.nav-logo { font-size:0.95rem; font-weight:800; color:var(--text); text-decoration:none; }
.nav-links { display:flex; align-items:center; gap:4px; }
.nav-links a { color:var(--text-dim); text-decoration:none; font-size:0.82rem; font-weight:500; padding:5px 12px; border-radius:5px; }
.nav-links a:hover { color:var(--text); }
.nav-links a.active { color:var(--text); background:var(--bg-elevated); }
.btn-pdf { display:inline-flex; align-items:center; gap:6px; padding:6px 14px; font-size:0.76rem; font-weight:600; border-radius:5px; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text); text-decoration:none; }
.btn-pdf:hover { border-color:var(--accent); }

.container { max-width:700px; margin:0 auto; padding:0 24px; }
.hero { text-align:center; padding:48px 0 24px; border-bottom:1px solid var(--border); }
.hero h1 { font-size:1.8rem; font-weight:900; letter-spacing:-0.02em; margin-bottom:6px; }
.hero p { color:var(--text-dim); font-size:0.9rem; }

main { padding:32px 0 60px; }

.section-block { margin-bottom:28px; }
.section-head {
  font-size:0.9rem; font-weight:700; padding:12px 16px; margin-bottom:4px;
  background:var(--bg-card); border:1px solid var(--border); border-radius:8px;
  display:flex; align-items:center; gap:10px; color:var(--text);
}
.section-head .head-icon { font-size:1.2rem; }
.section-head span { font-size:0.68rem; color:var(--text-muted); font-weight:400; margin-left:auto; }

.check-item {
  display:flex; align-items:center; gap:12px; padding:12px 16px 12px 28px;
  margin-bottom:2px; cursor:pointer; transition:all 0.1s; border-radius:6px;
  border-left:3px solid transparent;
}
.check-item:hover { background:var(--bg-elevated); }
.check-item.checked { border-left-color:var(--green); background:rgba(46,168,90,0.05); }
.check-item .icon { font-size:1.1rem; width:24px; text-align:center; flex-shrink:0; }
.check-item .text { flex:1; }
.check-item .text strong { display:block; font-size:0.84rem; margin-bottom:1px; }
.check-item .text span { font-size:0.72rem; color:var(--text-dim); }
.check-indicator {
  width:20px; height:20px; border-radius:5px; border:2px solid var(--border);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  transition:all 0.12s; font-size:0.65rem;
}
.check-item.checked .check-indicator { background:var(--green); border-color:var(--green); color:#000; }

/* Score */
.score-bar { margin-top:32px; text-align:center; }
.score-row { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:12px; }
.score-circle {
  width:110px; height:110px; border-radius:50%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; border:4px solid; transition:all 0.3s;
  flex-shrink:0;
}
.score-number { font-size:2.2rem; font-weight:900; line-height:1; }
.score-label { font-size:0.65rem; text-transform:uppercase; letter-spacing:0.05em; }
.score-low { border-color:var(--accent); color:var(--accent); }
.score-mid { border-color:var(--yellow); color:var(--yellow); }
.score-high { border-color:var(--green); color:var(--green); }
.score-msg { font-size:0.85rem; color:var(--text-dim); line-height:1.4; max-width:450px; margin:0 auto; }

footer { text-align:center; padding:28px 20px; border-top:1px solid var(--border); font-size:0.72rem; color:var(--text-muted); }
footer a { color:var(--accent); text-decoration:none; }

@media (max-width:500px) { .hero h1 { font-size:1.4rem; } .score-circle { width:90px; height:90px; } .score-number { font-size:1.8rem; } }
</style>
</head>
<body>

<nav class="top-nav">
  <div class="container">
    <a href="index.html" class="nav-logo">&#9994; azadi.wtf</a>
    <div class="nav-links">
      <a href="checklist.html" class="active">Checklist</a>
      <a href="history.html">Historical Movements</a>
      <a href="guide.html">Protest Guide</a>
      <a href="Protest%20Safely.pdf" class="btn-pdf" download>PDF</a>
    </div>
  </div>
</nav>

<div class="hero">
  <h1>Protest Packing Checklist</h1>
  <p>Items are grouped by conditions. Check off what you have packed — your readiness score updates automatically.</p>
</div>

<main class="container">
  <div id="checklist"></div>

  <div class="score-bar" id="scoreBar">
    <div class="score-row">
      <div class="score-circle score-low" id="scoreCircle">
        <span class="score-number" id="scoreNum">0%</span>
        <span class="score-label">Packed</span>
      </div>
      <p class="score-msg" id="scoreMsg"></p>
    </div>
  </div>
</main>

<footer>
  <a href="index.html">India Map</a> &nbsp;·&nbsp;
  <a href="guide.html">Protest Guide</a> &nbsp;·&nbsp;
  azadi.wtf &nbsp;·&nbsp; Stay safe. Protect each other. &#9994;
</footer>

<script>
(function() {
  var sections = [
    {
      head: '&#128170; Standard Protest — Must-Haves in Every Condition',
      sub: 'These are non-negotiable for any protest, anywhere.',
      items: [
        { icon:'💧', q:'At least 2 litres of drinking water', hint:'Dehydration impairs judgment. Indian summers demand extra hydration.' },
        { icon:'👟', q:'Comfortable closed-toe sports shoes', hint:'You may need to walk, stand, or run for hours. No sandals, no heels.' },
        { icon:'👖', q:'Comfortable pants or jeans you can run in', hint:'Full mobility is essential. Avoid restrictive clothing.' },
        { icon:'🪪', q:'Photocopy of ID — not the original', hint:'Police may confiscate originals. Carry a photocopy.' },
        { icon:'🍎', q:'Energizing snacks or dry fruits', hint:'You may be outside for hours. Keep your energy up.' },
        { icon:'👥', q:'Buddy system — at least one trusted person with you', hint:'Never go to a protest alone. Agree on a meeting point if separated.' },
      ]
    },
    {
      head: '&#128737; If Heavy Policing is Expected',
      sub: 'These become essential when police presence is significant.',
      items: [
        { icon:'🖊️', q:'Permanent marker', hint:'Write emergency contacts, legal aid numbers, and blood type on your arm.' },
        { icon:'🔋', q:'Power bank or backup charger', hint:'Network shutdowns are common. Keep your phone alive.' },
        { icon:'📞', q:'Legal aid numbers written on your arm', hint:'DLSA contact, NALSA (15100), lawyer number — not just in your phone.' },
        { icon:'🗺️', q:'Escape routes identified + offline map downloaded', hint:'Know 2-3 exits. Network shutdowns happen. Download Google Maps offline.' },
      ]
    },
    {
      head: '&#128167; If Rain or Water Cannons are Expected',
      sub: 'Water-soaked clothes worsen everything. Prepare for wet conditions.',
      items: [
        { icon:'🧥', q:'Raincoat or waterproof jacket', hint:'Wet clothes increase irritant absorption and risk of hypothermia.' },
        { icon:'📱', q:'Ziplock bags for phone and documents', hint:'Protect electronics from water. Water cannon spray may contain irritants.' },
        { icon:'👕', q:'Sealed change of clothes in a plastic bag', hint:'Change immediately after exposure. Avoids continued skin irritation.' },
      ]
    },
    {
      head: '&#128299; If Pellet Guns are Expected',
      sub: 'Delhi Police deployed pellet guns on July 20, 2026. These items can save your eyesight.',
      items: [
        { icon:'🧤', q:'Shatter-resistant goggles — ANSI Z87+ rated', hint:'ESSENTIAL. Pellets shatter regular glasses into your eyes. Swim goggles are NOT enough.' },
        { icon:'⛑️', q:'Helmet with full-face visor (motorcycle or cricket)', hint:'Best protection against pellets, batons, and stones. Motorcycle helmets provide best coverage.' },
        { icon:'🦺', q:'Body protection — thick notebook or magazine under clothing', hint:'Place inside clothing over chest. Reduces pellet penetration. Leather jackets help too.' },
      ]
    },
    {
      head: '&#128168; If Tear Gas is Expected',
      sub: 'Tear gas causes intense burning. These items reduce exposure and speed recovery.',
      items: [
        { icon:'😷', q:'N95 mask or bandana soaked in baking soda solution', hint:'Baking soda (3 tsp per 250ml water) neutralizes tear gas. Carry a small spray bottle.' },
        { icon:'👓', q:'Prescription glasses — NOT contact lenses', hint:'Contacts trap irritants against your cornea. Switch to glasses before attending.' },
        { icon:'🧴', q:'Avoid oil-based products on skin', hint:'No moisturizer, sunscreen, or coconut oil. Oil traps chemicals against your skin.' },
      ]
    },
    {
      head: '&#127992; If Stone Pelting is Expected',
      sub: 'Stones cause blunt-force injuries. Protect your head first.',
      items: [
        { icon:'⛑️', q:'Helmet — cricket, bike, or construction', hint:'A direct stone to the head can be fatal. Protect your skull above all else.' },
        { icon:'🧤', q:'Shatter-resistant goggles', hint:'Stones can cause permanent eye damage. Regular glasses are not sufficient.' },
      ]
    },
  ];

  function buildChecklist() {
    var html = '';
    sections.forEach(function(sec, si) {
      html += '<div class="section-block">';
      html += '<div class="section-head"><span class="head-icon">'+sec.head.split(' ')[0]+'</span>'+sec.head.substring(sec.head.indexOf(' ')+1)+'<span>'+sec.sub+'</span></div>';
      sec.items.forEach(function(item, ii) {
        html += '<div class="check-item" data-si="'+si+'" data-ii="'+ii+'" onclick="toggleItem(this)">';
        html += '<span class="icon">'+item.icon+'</span>';
        html += '<div class="text"><strong>'+item.q+'</strong><span>'+item.hint+'</span></div>';
        html += '<div class="check-indicator"></div>';
        html += '</div>';
      });
      html += '</div>';
    });
    document.getElementById('checklist').innerHTML = html;
    updateScore();
  }

  window.toggleItem = function(el) {
    el.classList.toggle('checked');
    el.querySelector('.check-indicator').textContent = el.classList.contains('checked') ? '✓' : '';
    updateScore();
  };

  function updateScore() {
    var all = document.querySelectorAll('.check-item');
    var checked = document.querySelectorAll('.check-item.checked').length;
    var total = all.length;
    var pct = total > 0 ? Math.round((checked / total) * 100) : 0;

    var circle = document.getElementById('scoreCircle');
    document.getElementById('scoreNum').textContent = pct + '%';
    circle.className = 'score-circle ' + (pct >= 70 ? 'score-high' : pct >= 40 ? 'score-mid' : 'score-low');

    var msg = document.getElementById('scoreMsg');
    var stdItems = document.querySelectorAll('.check-item[data-si="0"]');
    var stdChecked = document.querySelectorAll('.check-item[data-si="0"].checked').length;
    
    if (pct >= 90) msg.textContent = 'You are exceptionally well-prepared. Stay safe and protect others. ✊';
    else if (pct >= 60) msg.textContent = 'Good progress. Address the remaining unchecked items before you leave.';
    else if (stdChecked >= 4) msg.textContent = 'Standard essentials covered. Now work through the condition-specific sections that apply to your situation.';
    else msg.textContent = 'Start with the Standard Protest section. Those 6 items are non-negotiable for any protest. Then check the sections that match conditions you expect.';
  }

  buildChecklist();
})();
</script>
</body>
</html>
